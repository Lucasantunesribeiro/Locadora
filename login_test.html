<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Locadora</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        form { background: #f5f5f5; padding: 20px; border-radius: 8px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h2>Login - Sistema de Locadora</h2>
    
    <div class="info">
        <h4>Credenciais de teste:</h4>
        <p><strong>Admin:</strong> admin@locadora.com / senha: secret</p>
        <p><strong>Novo usuário:</strong> Use o cadastro primeiro</p>
    </div>
    
    <form id="loginForm">
        <input type="email" name="email" placeholder="Email" value="admin@locadora.com" required>
        <input type="password" name="senha" placeholder="Senha" value="secret" required>
        <button type="submit">Entrar</button>
    </form>
    
    <div id="result" class="result" style="display: none;"></div>
    
    <p><a href="/cadastro_ultimate.html">Criar nova conta</a></p>
    <p><a href="/teste_crud.html">Ir para teste CRUD</a></p>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const resultDiv = document.getElementById('result');
            
            try {
                console.log('Tentando login...');
                
                const response = await fetch('/api/login', {
                    method: 'POST',
                    body: formData
                });
                
                console.log('Response status:', response.status);
                
                const text = await response.text();
                console.log('Response text:', text);
                
                let data;
                try {
                    data = JSON.parse(text);
                } catch (parseError) {
                    console.error('Erro de parse JSON:', parseError);
                    throw new Error('Resposta não é JSON válido: ' + text.substring(0, 100));
                }
                
                if (data.status === 'success') {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = '✓ ' + data.message;
                    resultDiv.style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = data.redirect || '/';
                    }, 1000);
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = '✗ ' + (data.error || 'Erro desconhecido');
                    resultDiv.style.display = 'block';
                }
                
            } catch (error) {
                console.error('Erro na requisição:', error);
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '✗ Erro: ' + error.message;
                resultDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>

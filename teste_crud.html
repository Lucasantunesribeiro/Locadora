<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste CRUD - Sistema Locadora</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 20px auto; padding: 20px; }
        .section { background: #f5f5f5; padding: 20px; margin: 20px 0; border-radius: 8px; }
        .section h2 { margin-top: 0; color: #333; }
        .form-group { margin: 10px 0; }
        input, select, button { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 10px; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .btn-warning { background: #ffc107; color: #212529; }
        .btn-warning:hover { background: #e0a800; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Teste CRUD - Sistema de Locadora</h1>
    
    <!-- CRUD Usuários -->
    <div class="section">
        <h2>CRUD Usuários</h2>
        
        <h3>Criar Usuário</h3>
        <form id="createUserForm">
            <input type="text" name="nome" placeholder="Nome completo" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="senha" placeholder="Senha" required>
            <select name="role">
                <option value="user">Usuário</option>
                <option value="admin">Admin</option>
            </select>
            <button type="submit">Criar Usuário</button>
        </form>
        <div id="createUserResult" class="result" style="display: none;"></div>
        
        <h3>Listar Usuários</h3>
        <button onclick="listarUsuarios()">Carregar Usuários</button>
        <div id="usersList"></div>
        
        <h3>Atualizar Usuário</h3>
        <form id="updateUserForm">
            <input type="number" name="usuario_id" placeholder="ID do usuário" required>
            <input type="text" name="nome" placeholder="Nome completo" required>
            <input type="email" name="email" placeholder="Email" required>
            <select name="role">
                <option value="user">Usuário</option>
                <option value="admin">Admin</option>
            </select>
            <button type="submit">Atualizar Usuário</button>
        </form>
        <div id="updateUserResult" class="result" style="display: none;"></div>
        
        <h3>Deletar Usuário</h3>
        <form id="deleteUserForm">
            <input type="number" name="usuario_id" placeholder="ID do usuário" required>
            <button type="submit" class="btn-danger">Deletar Usuário</button>
        </form>
        <div id="deleteUserResult" class="result" style="display: none;"></div>
    </div>

    <!-- CRUD Carros -->
    <div class="section">
        <h2>CRUD Carros</h2>
        
        <h3>Criar Carro</h3>
        <form id="createCarForm">
            <input type="text" name="marca" placeholder="Marca" required>
            <input type="text" name="modelo" placeholder="Modelo" required>
            <input type="number" name="ano" placeholder="Ano" required>
            <input type="text" name="cor" placeholder="Cor">
            <input type="number" name="preco_diario" placeholder="Preço diário" step="0.01" required>
            <button type="submit">Criar Carro</button>
        </form>
        <div id="createCarResult" class="result" style="display: none;"></div>
        
        <h3>Listar Carros</h3>
        <button onclick="listarCarros()">Carregar Carros</button>
        <div id="carsList"></div>
        
        <h3>Atualizar Carro</h3>
        <form id="updateCarForm">
            <input type="number" name="carro_id" placeholder="ID do carro" required>
            <input type="text" name="marca" placeholder="Marca" required>
            <input type="text" name="modelo" placeholder="Modelo" required>
            <input type="number" name="ano" placeholder="Ano" required>
            <input type="text" name="cor" placeholder="Cor">
            <input type="number" name="preco_diario" placeholder="Preço diário" step="0.01" required>
            <button type="submit">Atualizar Carro</button>
        </form>
        <div id="updateCarResult" class="result" style="display: none;"></div>
        
        <h3>Deletar Carro</h3>
        <form id="deleteCarForm">
            <input type="number" name="carro_id" placeholder="ID do carro" required>
            <button type="submit" class="btn-danger">Deletar Carro</button>
        </form>
        <div id="deleteCarResult" class="result" style="display: none;"></div>
    </div>

    <!-- CRUD Aluguéis -->
    <div class="section">
        <h2>CRUD Aluguéis</h2>
        
        <h3>Criar Aluguel</h3>
        <form id="createRentalForm">
            <input type="number" name="carro_id" placeholder="ID do carro" required>
            <input type="date" name="data_inicio" required>
            <input type="date" name="data_fim" required>
            <button type="submit">Criar Aluguel</button>
        </form>
        <div id="createRentalResult" class="result" style="display: none;"></div>
        
        <h3>Listar Aluguéis</h3>
        <button onclick="listarAlugueis()">Carregar Aluguéis</button>
        <div id="rentalsList"></div>
        
        <h3>Atualizar Aluguel</h3>
        <form id="updateRentalForm">
            <input type="number" name="aluguel_id" placeholder="ID do aluguel" required>
            <select name="status">
                <option value="ativo">Ativo</option>
                <option value="finalizado">Finalizado</option>
                <option value="cancelado">Cancelado</option>
            </select>
            <input type="date" name="data_inicio" required>
            <input type="date" name="data_fim" required>
            <button type="submit">Atualizar Aluguel</button>
        </form>
        <div id="updateRentalResult" class="result" style="display: none;"></div>
        
        <h3>Deletar Aluguel</h3>
        <form id="deleteRentalForm">
            <input type="number" name="aluguel_id" placeholder="ID do aluguel" required>
            <button type="submit" class="btn-danger">Deletar Aluguel</button>
        </form>
        <div id="deleteRentalResult" class="result" style="display: none;"></div>
    </div>

    <script>
        // Função helper para fazer requisições
        async function makeRequest(url, method = 'GET', data = null) {
            const options = {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                }
            };
            
            if (data && method !== 'GET') {
                if (data instanceof FormData) {
                    delete options.headers['Content-Type'];
                    options.body = data;
                } else {
                    options.body = JSON.stringify(data);
                }
            }
            
            try {
                const response = await fetch(url, options);
                const text = await response.text();
                
                try {
                    return JSON.parse(text);
                } catch (e) {
                    throw new Error('Resposta não é JSON válido: ' + text.substring(0, 100));
                }
            } catch (error) {
                throw error;
            }
        }

        // Função helper para mostrar resultado
        function showResult(elementId, data, isError = false) {
            const element = document.getElementById(elementId);
            element.className = isError ? 'result error' : 'result success';
            element.innerHTML = isError ? '✗ ' + data : '✓ ' + data;
            element.style.display = 'block';
            
            setTimeout(() => {
                element.style.display = 'none';
            }, 5000);
        }

        // CRUD Usuários
        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            try {
                const result = await makeRequest('/api/usuarios', 'POST', formData);
                showResult('createUserResult', result.message || 'Usuário criado com sucesso');
                e.target.reset();
                listarUsuarios();
            } catch (error) {
                showResult('createUserResult', error.message, true);
            }
        });

        document.getElementById('updateUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            try {
                const result = await makeRequest('/api/atualizar_usuario', 'POST', formData);
                showResult('updateUserResult', result.message || 'Usuário atualizado');
                e.target.reset();
                listarUsuarios();
            } catch (error) {
                showResult('updateUserResult', error.message, true);
            }
        });

        document.getElementById('deleteUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            try {
                const result = await makeRequest('/api/deletar_usuario', 'POST', formData);
                showResult('deleteUserResult', result.message || 'Usuário deletado');
                e.target.reset();
                listarUsuarios();
            } catch (error) {
                showResult('deleteUserResult', error.message, true);
            }
        });

        async function listarUsuarios() {
            try {
                const users = await makeRequest('/api/usuarios');
                let html = '<table><tr><th>ID</th><th>Nome</th><th>Email</th><th>Role</th></tr>';
                users.forEach(user => {
                    html += `<tr><td>${user.id}</td><td>${user.nome}</td><td>${user.email}</td><td>${user.role}</td></tr>`;
                });
                html += '</table>';
                document.getElementById('usersList').innerHTML = html;
            } catch (error) {
                document.getElementById('usersList').innerHTML = 'Erro ao carregar usuários: ' + error.message;
            }
        }

        // CRUD Carros
        document.getElementById('createCarForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            try {
                const result = await makeRequest('/api/carros', 'POST', formData);
                showResult('createCarResult', result.message || 'Carro criado com sucesso');
                e.target.reset();
                listarCarros();
            } catch (error) {
                showResult('createCarResult', error.message, true);
            }
        });

        document.getElementById('updateCarForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            try {
                const result = await makeRequest('/api/atualizar_carro', 'POST', formData);
                showResult('updateCarResult', result.message || 'Carro atualizado');
                e.target.reset();
                listarCarros();
            } catch (error) {
                showResult('updateCarResult', error.message, true);
            }
        });

        document.getElementById('deleteCarForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            try {
                const result = await makeRequest('/api/deletar_carro', 'POST', formData);
                showResult('deleteCarResult', result.message || 'Carro deletado');
                e.target.reset();
                listarCarros();
            } catch (error) {
                showResult('deleteCarResult', error.message, true);
            }
        });

        async function listarCarros() {
            try {
                const cars = await makeRequest('/api/carros');
                let html = '<table><tr><th>ID</th><th>Marca</th><th>Modelo</th><th>Ano</th><th>Cor</th><th>Preço</th><th>Disponível</th></tr>';
                cars.forEach(car => {
                    html += `<tr><td>${car.id}</td><td>${car.marca}</td><td>${car.modelo}</td><td>${car.ano}</td><td>${car.cor}</td><td>R$ ${car.preco_diario}</td><td>${car.disponivel ? 'Sim' : 'Não'}</td></tr>`;
                });
                html += '</table>';
                document.getElementById('carsList').innerHTML = html;
            } catch (error) {
                document.getElementById('carsList').innerHTML = 'Erro ao carregar carros: ' + error.message;
            }
        }

        // CRUD Aluguéis
        document.getElementById('createRentalForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            try {
                const result = await makeRequest('/api/alugueis', 'POST', formData);
                showResult('createRentalResult', result.message || 'Aluguel criado com sucesso');
                e.target.reset();
                listarAlugueis();
            } catch (error) {
                showResult('createRentalResult', error.message, true);
            }
        });

        document.getElementById('updateRentalForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            try {
                const result = await makeRequest('/api/atualizar_aluguel', 'POST', formData);
                showResult('updateRentalResult', result.message || 'Aluguel atualizado');
                e.target.reset();
                listarAlugueis();
            } catch (error) {
                showResult('updateRentalResult', error.message, true);
            }
        });

        document.getElementById('deleteRentalForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            try {
                const result = await makeRequest('/api/deletar_aluguel', 'POST', formData);
                showResult('deleteRentalResult', result.message || 'Aluguel deletado');
                e.target.reset();
                listarAlugueis();
            } catch (error) {
                showResult('deleteRentalResult', error.message, true);
            }
        });

        async function listarAlugueis() {
            try {
                const rentals = await makeRequest('/api/alugueis');
                let html = '<table><tr><th>ID</th><th>Usuário</th><th>Carro</th><th>Início</th><th>Fim</th><th>Valor</th><th>Status</th></tr>';
                rentals.forEach(rental => {
                    html += `<tr><td>${rental.id}</td><td>${rental.usuario_nome}</td><td>${rental.marca} ${rental.modelo}</td><td>${rental.data_inicio}</td><td>${rental.data_fim}</td><td>R$ ${rental.valor_total}</td><td>${rental.status}</td></tr>`;
                });
                html += '</table>';
                document.getElementById('rentalsList').innerHTML = html;
            } catch (error) {
                document.getElementById('rentalsList').innerHTML = 'Erro ao carregar aluguéis: ' + error.message;
            }
        }

        // Carregar listas iniciais
        window.addEventListener('load', () => {
            listarUsuarios();
            listarCarros();
            listarAlugueis();
        });
    </script>
</body>
</html>
